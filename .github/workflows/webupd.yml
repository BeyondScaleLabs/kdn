name: fullsend-webupd

on:
  schedule:
    # Run daily at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: webupd
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kdn repository
        uses: actions/checkout@v4

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: BeyondScaleLabs/website
          token: ${{ secrets.WEBSITE_GH_TOKEN }}
          path: target-repo


      - name: Install fullsend CLI
        uses: fullsend-ai/fullsend@84c8bbbb821ff85136854150b06740253709b3b8 # v0.37.0
        with:
          agent: __install_only__

      - name: Run webupd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBSITE_GH_TOKEN: ${{ secrets.WEBSITE_GH_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          CLOUD_ML_REGION: ${{ vars.FULLSEND_GCP_REGION }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          fullsend run webupd \
            --fullsend-dir "$GITHUB_WORKSPACE/.fullsend" \
            --target-repo "$GITHUB_WORKSPACE/target-repo" \
            --output-dir "$GITHUB_WORKSPACE/output"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullsend-webupd
          path: ${{ github.workspace }}/output



          name: fullsend-webupd

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  packages: read
  pull-requests: write

jobs:
  harness:
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@84c8bbbb821ff85136854150b06740253709b3b8 # v0.37.0
    with:
      matrix: >-
        {"include":[{"agent":"webupd","source_repo":"${{ github.repository }}","role":"coder","event_payload":"{\"source\":{\"system\":\"schedule\"}}","status_repo":"","status_number":""}]}
      mint_url: https://mint.fullsend.sh
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
