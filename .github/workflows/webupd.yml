name: fullsend-webupd

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  harness:
    permissions:
      actions: write
      id-token: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@84c8bbbb821ff85136854150b06740253709b3b8 # v0.37.0
    with:
      matrix: >-
        {"include":[{"agent":"webupd","source_repo":"BeyondScaleLabs/kdn","role":"harness","event_payload":"{\"source\":{\"system\":\"schedule\"}}","status_repo":"","status_number":""}]}
      install_mode: per-repo
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      runner_image: ubuntu-24.04
    secrets: inherit
