# Untrusted half of the AI code review: runs PR code with no secrets and a read-only token,
# then hands the checkout to codereview-run.yaml through artifacts.
# Everything produced here is attacker-controlled and treated as such by codereview-run.yaml.

name: codereview-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Cheap filter to avoid building for external contributors until a maintainer posts
  # `/ok-to-test <sha>`. Not a security boundary: codereview-run.yaml re-checks with the permission API.
  gate:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Check author or /ok-to-test approval
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          approved=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | .body' \
            | sed -nE 's/^\/ok-to-test ([0-9a-f]{7,40})[[:space:]]*$/\1/p' \
            | while read -r sha; do if [[ "$HEAD_SHA" == "$sha"* ]]; then echo yes; fi; done | head -n1)
          if [[ "$approved" == "yes" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::External contributor: a maintainer must comment '/ok-to-test ${HEAD_SHA}' to run the AI code review."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: ${{ needs.gate.outputs.ok == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # --ignore-scripts: dependency lifecycle scripts never run, node_modules is only there for the reviewer to read.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Write PR diff and metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git diff "$BASE_SHA...$HEAD_SHA" > pr.diff
          mkdir -p "$RUNNER_TEMP/review-meta"
          jq -n --argjson pr_number "$PR_NUMBER" --arg head_sha "$HEAD_SHA" --arg base_sha "$BASE_SHA" \
            --arg title "$PR_TITLE" --arg body "$PR_BODY" \
            '{pr_number: $pr_number, head_sha: $head_sha, base_sha: $base_sha, title: $title, body: $body}' \
            | tee meta.json > "$RUNNER_TEMP/review-meta/meta.json"

      # tar keeps pnpm symlinks and dotfiles that upload-artifact would follow or drop.
      - name: Archive checkout
        run: tar -czf "$RUNNER_TEMP/review-src.tgz" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-meta
          path: ${{ runner.temp }}/review-meta/meta.json
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-src
          path: ${{ runner.temp }}/review-src.tgz
          compression-level: 0
          retention-days: 7
