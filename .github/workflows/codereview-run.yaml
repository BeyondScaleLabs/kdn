# Trusted half of the AI code review. workflow_run always runs this file from the default
# branch, so a PR cannot change it. The PR checkout from codereview-pr.yaml is untrusted: it is
# never executed here, only mounted read-only into an OpenShell sandbox where Claude reviews it.
#
# Jobs:
#   start  - authorize, create the "in progress" check run         (checks: write, no PR code)
#   review - run Claude in the sandbox                              (GCP token, no GitHub write)
#   report - complete the check run and upsert the PR comment       (checks/PR write, no PR code)
#
# Required on the GCP side: restrict the WIF provider with an attribute condition, otherwise any
# workflow (including one modified in a same-repo branch PR) can mint Vertex tokens, e.g.:
#   assertion.repository == '<owner>/<repo>' && assertion.ref == 'refs/heads/main'
#   && assertion.workflow_ref.startsWith('<owner>/<repo>/.github/workflows/codereview-run.yaml@')
# (list other workflows as well if they share the provider, or use a dedicated one).
# The principal only needs roles/aiplatform.user.
#
# The review is advisory: do not make this check required or use it for auto-merge.

name: codereview-run

on:
  workflow_run:
    workflows: [codereview-pr]
    types: [completed]

concurrency:
  # One review per PR: a new commit cancels the review of the previous one. The PR number is not
  # available here (workflow_run.pull_requests is empty for forks), the head repo + branch is.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

env:
  OPENSHELL_VERSION: '0.1.4'
  # openshell_0.1.4-1_arm64.deb from openshell-checksums-sha256.txt of the v0.1.4 release
  OPENSHELL_DEB_SHA256: 803939a059db6cc2a1ab38ff49e5c57e41b42549ac555130f13749d8ed6f46fb
  # providers/google-vertex-ai.yaml at the v0.1.4 tag commit (pinned by sha, verified by hash)
  OPENSHELL_PROFILE_URL: https://raw.githubusercontent.com/NVIDIA/OpenShell/5a7728c304b5528e954e9ae900cf21f84e1a12b1/providers/google-vertex-ai.yaml
  OPENSHELL_PROFILE_SHA256: 96c5006fcbf7d6ec8f83dc75fad35f6ae1213573db14543ab06b570ddc9edaeb
  # arm64-only image, hence the arm runner for the review job
  SANDBOX_IMAGE: quay.io/fbenoit/openshell-image-kaiden:20261003@sha256:c078c82e3773a2639324b8a3f578f0bfc4aa9ca2a6009ff4774cd4895f8a0b74
  REVIEW_MODEL: claude-opus-5-5
  REVIEW_TIMEOUT_SECS: 300
  CHECK_NAME: AI code review

jobs:
  start:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      checks: write
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      prNumber: ${{ steps.authorize.outputs.prNumber }}
      headSha: ${{ steps.authorize.outputs.headSha }}
      checkRunId: ${{ steps.check.outputs.checkRunId }}
    steps:
      # Missing when the gate of codereview-pr skipped the build.
      - name: Download PR metadata
        id: meta
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: review-meta
          path: ${{ runner.temp }}/meta
          github-token: ${{ github.token }}

      - name: Validate PR and authorize
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          META: ${{ runner.temp }}/meta/meta.json
        run: |
          set -euo pipefail
          deny() { echo "::notice::$1"; echo "authorized=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [[ -f "$META" ]] || deny "No review-meta artifact: build was skipped by the gate"

          # workflow_run.pull_requests is empty for forks, so the number comes from the artifact: verify it.
          pr_number=$(jq -r '.pr_number' "$META")
          [[ "$pr_number" =~ ^[0-9]+$ ]] || deny "Invalid PR number in artifact"
          pr=$(gh api "repos/$REPO/pulls/$pr_number")
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$HEAD_SHA" ]] || deny "PR #$pr_number head is not $HEAD_SHA (outdated run or forged metadata)"

          has_write() {
            local role
            role=$(gh api "repos/$REPO/collaborators/$1/permission" --jq '.role_name' 2>/dev/null || echo none)
            [[ "$role" == admin || "$role" == maintain || "$role" == write ]]
          }

          authorized=false
          if has_write "$(jq -r '.user.login' <<< "$pr")"; then
            authorized=true
          else
            # /ok-to-test <sha> comments matching this commit, from users with write access
            while read -r login; do
              if [[ -n "$login" ]] && has_write "$login"; then authorized=true; break; fi
            done < <(gh api "repos/$REPO/issues/$pr_number/comments" --paginate \
              --jq '.[] | "\(.user.login) \(.body)"' \
              | sed -nE 's/^([^ ]+) \/ok-to-test ([0-9a-f]{7,40})[[:space:]]*$/\1 \2/p' \
              | while read -r login sha; do if [[ "$HEAD_SHA" == "$sha"* ]]; then echo "$login"; fi; done | sort -u)
          fi
          [[ "$authorized" == true ]] || deny "PR #$pr_number: author has no write access and no '/ok-to-test ${HEAD_SHA}' from a maintainer"

          {
            echo "authorized=true"
            echo "prNumber=$pr_number"
            echo "headSha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Create in-progress check run
        id: check
        if: ${{ steps.authorize.outputs.authorized == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.authorize.outputs.headSha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/check-runs" \
            -f name="$CHECK_NAME" -f head_sha="$HEAD_SHA" -f status=in_progress -f details_url="$RUN_URL" \
            -f "output[title]=Review in progress" \
            -f "output[summary]=Claude \`$REVIEW_MODEL\` is reviewing commit \`${HEAD_SHA:0:7}\` (timeout ${REVIEW_TIMEOUT_SECS}s). [Follow the run]($RUN_URL)." \
            --jq '.id')
          echo "checkRunId=$id" >> "$GITHUB_OUTPUT"

  review:
    needs: start
    if: ${{ needs.start.outputs.authorized == 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      PR_NUMBER: ${{ needs.start.outputs.prNumber }}
      HEAD_SHA: ${{ needs.start.outputs.headSha }}
      SRC_DIR: ${{ github.workspace }}/review-src
    steps:
      - name: Checkout trusted review files from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: .github/codereview
          persist-credentials: false

      - name: Download PR checkout
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: review-src
          path: ${{ runner.temp }}/dl
          github-token: ${{ github.token }}

      # Untrusted content: extracted, never executed on this host, only bind-mounted read-only.
      - name: Extract PR checkout
        run: |
          set -euo pipefail
          mkdir -p "$SRC_DIR"
          tar --no-same-owner --no-same-permissions -xzf "$RUNNER_TEMP/dl/review-src.tgz" -C "$SRC_DIR"
          rm -rf "$RUNNER_TEMP/dl"

      # Same setup as OpenShell v0.1.4 .github/actions/setup-e2e-podman (Podman 5 is required).
      - name: Install rootless Podman
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor fuse-overlayfs passt podman conmon uidmap
          podman_config="$RUNNER_TEMP/openshell-containers.conf"
          printf '%s\n' '[engine]' 'conmon_path = ["/usr/bin/conmon"]' > "$podman_config"
          echo "/usr/bin" >> "$GITHUB_PATH"
          echo "CONTAINERS_CONF_OVERRIDE=$podman_config" >> "$GITHUB_ENV"
          # Ubuntu's pasta profile blocks the signal Podman uses to stop it.
          profile=/etc/apparmor.d/usr.bin.pasta
          rule='  signal (receive) peer=podman,'
          if ! sudo grep -Fqx "$rule" "$profile"; then
            sudo sed -i '\|^  include <abstractions/pasta>$|a\  signal (receive) peer=podman,' "$profile"
          fi
          sudo apparmor_parser --replace "$profile"
          grep -q "^$USER:" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$USER"
          grep -q "^$USER:" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$USER"
          # A lingering user manager provides XDG_RUNTIME_DIR and `systemctl --user` for podman.socket and the gateway.
          sudo loginctl enable-linger "$USER"
          runtime_dir="/run/user/$(id -u)"
          for _ in $(seq 30); do [[ -S "$runtime_dir/bus" ]] && break; sleep 1; done
          {
            echo "XDG_RUNTIME_DIR=$runtime_dir"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus"
          } >> "$GITHUB_ENV"
          case "$(/usr/bin/podman version --format '{{.Client.Version}}')" in
            5.*) ;;
            *) echo "::error::OpenShell needs Podman 5.x"; exit 1 ;;
          esac

      - name: Install OpenShell
        run: |
          set -euo pipefail
          deb="openshell_${OPENSHELL_VERSION}-1_arm64.deb"
          curl -fsSL -o "$RUNNER_TEMP/$deb" "https://github.com/NVIDIA/OpenShell/releases/download/v${OPENSHELL_VERSION}/$deb"
          echo "$OPENSHELL_DEB_SHA256  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo apt-get install -y "$RUNNER_TEMP/$deb"
          openshell --version || true

      # Bind mounts need driver config allowed and resource admission off (OpenShell docs: Podman Mounts).
      - name: Start OpenShell gateway with the Podman driver
        run: |
          set -euo pipefail
          mkdir -p ~/.config/openshell
          cat > ~/.config/openshell/gateway.toml <<'EOF'
          [openshell]
          version = 2

          [openshell.gateway]
          compute_driver = "podman"

          [openshell.drivers.podman]
          image_pull_policy = "if_not_present"
          allow_driver_config = true
          enable_bind_mounts = true

          [openshell.drivers.podman.resource_admission]
          enabled = false
          EOF
          systemctl --user daemon-reload
          systemctl --user enable --now podman.socket
          systemctl --user enable --now openshell-gateway
          # `gateway add --local` imports the mTLS bundle once the service has generated it.
          added=false
          for _ in $(seq 60); do
            if [[ "$added" == false ]] && openshell gateway add https://127.0.0.1:17670 --local --name openshell; then
              added=true
            fi
            if [[ "$added" == true ]] && openshell status 2>/dev/null | grep -q 'Version:'; then
              openshell status
              exit 0
            fi
            sleep 2
          done
          systemctl --user status openshell-gateway --no-pager || true
          journalctl --user -u openshell-gateway --no-pager | tail -n 100 || true
          exit 1

      - name: Pull sandbox image
        run: podman pull "$SANDBOX_IMAGE"

      # Direct WIF, no credentials file on disk: auth_token is the short-lived federated access token.
      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          project_id: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          create_credentials_file: false

      # Only the gateway holds the token; the sandbox gets a placeholder that the gateway proxy
      # resolves on egress to the Vertex hosts, and only for the claude binary (see profile).
      - name: Register Vertex AI provider
        env:
          GOOGLE_VERTEX_AI_TOKEN: ${{ steps.auth.outputs.auth_token }}
          VERTEX_PROJECT: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          VERTEX_REGION: ${{ vars.FULLSEND_GCP_REGION }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/review-vertex-ai.yaml"
          curl -fsSL -o "$RUNNER_TEMP/google-vertex-ai.yaml" "$OPENSHELL_PROFILE_URL"
          echo "$OPENSHELL_PROFILE_SHA256  $RUNNER_TEMP/google-vertex-ai.yaml" | sha256sum -c -
          # Distinct id, and only the image's claude CLI may use the Vertex token.
          yq '.id = "review-vertex-ai" | .display_name = "Google Vertex AI (code review)" | .binaries = ["/usr/local/bin/claude"]' \
            "$RUNNER_TEMP/google-vertex-ai.yaml" > "$profile"
          openshell provider profile lint -f "$profile"
          openshell provider profile import -f "$profile" --global
          openshell provider create --name vertex --type review-vertex-ai --global-profile \
            --credential GOOGLE_VERTEX_AI_TOKEN \
            --config "VERTEX_AI_PROJECT_ID=$VERTEX_PROJECT" \
            --config "VERTEX_AI_REGION=$VERTEX_REGION"

      - name: Create sandbox
        id: sandbox
        run: |
          set -euo pipefail
          name="review-${PR_NUMBER}-${HEAD_SHA:0:7}"
          mounts=$(jq -cn --arg src "$SRC_DIR" \
            '{podman: {mounts: [{type: "bind", source: $src, target: "/sandbox/src", read_only: true}]}}')
          openshell sandbox create --name "$name" --from "$SANDBOX_IMAGE" \
            --provider vertex --no-auto-providers --detach --no-tty \
            --driver-config-json "$mounts"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Claude runs outside the PR tree with project settings, hooks, CLAUDE.md discovery and MCP
      # disabled, so files in the PR cannot configure it. Egress is limited to the Vertex hosts.
      - name: Run review
        id: run
        env:
          SANDBOX: ${{ steps.sandbox.outputs.name }}
        run: |
          set -uo pipefail
          start=$(date +%s)
          # shellcheck disable=SC2016 # the inner script expands inside the sandbox, not here
          timeout --kill-after=30 "$((REVIEW_TIMEOUT_SECS + 60))" \
            openshell sandbox exec -n "$SANDBOX" --timeout "$REVIEW_TIMEOUT_SECS" --no-tty \
              --env CLAUDE_CODE_USE_VERTEX=1 \
              --env CLAUDE_CODE_SKIP_VERTEX_AUTH=1 \
              --env CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
              -- sh -c '
                export ANTHROPIC_CUSTOM_HEADERS="Authorization: Bearer ${GOOGLE_VERTEX_AI_TOKEN}"
                mkdir -p /tmp/work && cd /tmp/work || exit 1
                exec claude -p "$1" --append-system-prompt "$2" --model "$3" \
                  --bare --setting-sources user --strict-mcp-config --no-session-persistence \
                  --add-dir /sandbox/src \
                  --permission-mode dontAsk \
                  --allowedTools "Read,Grep,Glob,Bash(git -C /sandbox/src diff:*),Bash(git -C /sandbox/src log:*),Bash(git -C /sandbox/src show:*),Bash(git -C /sandbox/src blame:*),Write(//tmp/review-output.json)" \
                  --disallowedTools "WebFetch,WebSearch"
              ' sh \
              "$(cat trusted/.github/codereview/task.md)" \
              "$(cat trusted/.github/codereview/pr-reviewer.md)" \
              "$REVIEW_MODEL"
          code=$?
          duration=$(( $(date +%s) - start ))
          echo "Review exited with $code after ${duration}s"
          timed_out=false
          if (( code == 124 || duration >= REVIEW_TIMEOUT_SECS )); then timed_out=true; fi
          {
            echo "durationS=$duration"
            echo "timedOut=$timed_out"
          } >> "$GITHUB_OUTPUT"

      - name: Collect review output and delete sandbox
        if: ${{ always() && steps.sandbox.outputs.name }}
        env:
          SANDBOX: ${{ steps.sandbox.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          openshell sandbox download "$SANDBOX" /tmp/review-output.json "$RUNNER_TEMP/out" || echo "::warning::No /tmp/review-output.json in the sandbox"
          openshell sandbox delete "$SANDBOX" || true

      # The output is model-written and the model read attacker-controlled content: validate it
      # strictly, fall back to REQUEST_CHANGES, and take PR number/sha from trusted metadata only.
      - name: Validate review output
        if: ${{ always() }}
        env:
          DURATION_S: ${{ steps.run.outputs.durationS || 0 }}
          TIMED_OUT: ${{ steps.run.outputs.timedOut || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out=$(find "$RUNNER_TEMP/out" -type f -name review-output.json 2>/dev/null | head -n1 || true)
          failed=true
          review='{"status":"REQUEST_CHANGES","comments":"Automated review failed or timed out before producing a valid result. See the run logs."}'
          if [[ -n "$out" ]] && (( $(stat -c %s "$out") <= 1048576 )) \
            && jq -e '(.status | IN("ACCEPT", "ACCEPT_WITH_NITS", "REQUEST_CHANGES")) and (.comments | type == "string")' "$out" >/dev/null 2>&1; then
            review=$(jq -c '{status, comments}' "$out")
            failed=false
          fi
          mkdir -p "$RUNNER_TEMP/result"
          jq -n --argjson review "$review" --argjson pr_number "$PR_NUMBER" --arg head_sha "$HEAD_SHA" \
            --arg model "$REVIEW_MODEL" --argjson duration_s "$DURATION_S" --argjson timed_out "$TIMED_OUT" \
            --argjson failed "$failed" --arg run_url "$RUN_URL" \
            '$review + {pr_number: $pr_number, head_sha: $head_sha, model: $model, duration_s: $duration_s,
                        timed_out: $timed_out, failed: $failed, run_url: $run_url}' \
            > "$RUNNER_TEMP/result/review-result.json"

          # Model text must not be interpreted as workflow commands.
          stop_token=$(openssl rand -hex 16)
          echo "Review result for PR #$PR_NUMBER (${HEAD_SHA:0:7}):"
          echo "::stop-commands::$stop_token"
          cat "$RUNNER_TEMP/result/review-result.json"
          echo "::$stop_token::"

      - name: Upload review result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-result
          path: ${{ runner.temp }}/result/review-result.json

  report:
    needs: [start, review]
    if: ${{ always() && needs.start.outputs.authorized == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      checks: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ needs.start.outputs.prNumber }}
      HEAD_SHA: ${{ needs.start.outputs.headSha }}
      CHECK_RUN_ID: ${{ needs.start.outputs.checkRunId }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout trusted scripts from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/codereview
          persist-credentials: false

      - name: Download review result
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-result
          path: ${{ runner.temp }}/result

      # Cancelled by a newer commit: close the check without touching the PR comment,
      # which belongs to the newest review.
      - name: Mark check as superseded
        if: ${{ needs.review.result == 'cancelled' && env.CHECK_RUN_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X PATCH "repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -f status=completed -f conclusion=cancelled \
            -f "output[title]=Superseded by a newer commit" \
            -f "output[summary]=This review was cancelled because the pull request was updated. [Run details]($RUN_URL)." \
            --jq '.html_url'

      - name: Render report
        if: ${{ needs.review.result != 'cancelled' }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/result/review-result.json"
          if [[ ! -f "$result" ]]; then
            # review job crashed, was cancelled or hit its job timeout
            jq -n --argjson pr_number "$PR_NUMBER" --arg head_sha "$HEAD_SHA" --arg model "$REVIEW_MODEL" --arg run_url "$RUN_URL" \
              '{status: "REQUEST_CHANGES", comments: "Automated review job did not complete. See the run logs.",
                pr_number: $pr_number, head_sha: $head_sha, model: $model, duration_s: 0,
                timed_out: false, failed: true, run_url: $run_url}' > "$result"
          fi
          bash scripts/codereview/render-report.sh "$result" "$RUNNER_TEMP/report"

      - name: Complete check run
        if: ${{ needs.review.result != 'cancelled' && env.CHECK_RUN_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PATCH "repos/$REPO/check-runs/$CHECK_RUN_ID" --input "$RUNNER_TEMP/report/check.json" --jq '.html_url'

      # One sticky comment per PR, updated on each review.
      - name: Comment on PR
        if: ${{ needs.review.result != 'cancelled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          body=$(jq -Rs '{body: .}' "$RUNNER_TEMP/report/comment.md")
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ai-code-review -->"))) | .id' | head -n1)
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input - <<< "$body" --jq '.html_url'
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input - <<< "$body" --jq '.html_url'
          fi
